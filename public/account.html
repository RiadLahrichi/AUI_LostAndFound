<!DOCTYPE html>
<html lang="en">
<head>
    <title>My Account - AUI Lost and Found</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

<nav class="navbar"></nav>

<div class="content">
    <h2 id="greeting">My Account</h2>

    <div class="panel">
        <h3>Notifications</h3>
        <div id="notifications"></div>
        <button id="mark-read" class="button small">Mark all as read</button>
    </div>

    <div class="panel">
        <h3>My items</h3>
        <div id="my-items"></div>
    </div>
</div>

<script src="app.js"></script>
<script>
    async function loadPage() {
        const user = await showMenu();
        if (!user) {
            window.location.href = 'login.html';
            return;
        }
        document.getElementById('greeting').textContent = `Hello, ${user.first_name}`;

        const notifications = await api('/notifications');
        document.getElementById('notifications').innerHTML = notifications.length === 0
            ? '<p class="empty">No notifications yet.</p>'
            : notifications.map((n) => `
                <div class="list-item ${n.is_read ? '' : 'unread'}">
                    ${escapeHtml(n.message)}
                    ${n.item_id ? `<a href="item.html?id=${n.item_id}">Open the item</a>` : ''}
                    <p class="small-text">${new Date(n.created_at).toLocaleString()}</p>
                </div>`).join('');

        const items = await api('/items/mine');
        document.getElementById('my-items').innerHTML = items.length === 0
            ? '<p class="empty">You have not reported any item yet.</p>'
            : items.map((item) => `
                <div class="list-item">
                    <span class="badge ${item.kind}">${item.kind}</span>
                    <span class="badge status">${item.status}</span>
                    <a href="item.html?id=${item.item_id}">${escapeHtml(item.title)}</a>
                    ${item.pending_claims > 0 ? `<strong>${item.pending_claims} claim(s) waiting for you</strong>` : ''}
                </div>`).join('');
    }

    document.getElementById('mark-read').addEventListener('click', async () => {
        await sendJson('/notifications/read', {});
        window.location.reload();
    });

    loadPage();
</script>
</body>
</html>
