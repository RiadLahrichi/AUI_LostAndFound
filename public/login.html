<!DOCTYPE html>
<html lang="en">
<head>
    <title>Login - AUI Lost and Found</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

<nav class="navbar"></nav>

<div class="content">
    <div class="form-container">
        <h2>Login to AUI Lost and Found</h2>
        <form id="login-form">
            <label for="email">Email</label>
            <input type="email" id="email" name="email" placeholder="yourname@aui.ma" required>

            <label for="password">Password</label>
            <input type="password" id="password" name="password" required>

            <button type="submit" class="button">Login</button>
        </form>
        <div id="message" class="message"></div>
        <p>Don't have an account? <a href="signup.html">Sign up here.</a></p>
    </div>
</div>

<script src="app.js"></script>
<script>
    const form = document.getElementById('login-form');

    form.addEventListener('submit', async (event) => {
        event.preventDefault();
        try {
            // Turns the form into { email: ..., password: ... }
            await sendJson('/login', Object.fromEntries(new FormData(form)));
            window.location.href = 'account.html';
        } catch (error) {
            showMessage(document.getElementById('message'), error.message, true);
        }
    });

    showMenu();
</script>
</body>
</html>
